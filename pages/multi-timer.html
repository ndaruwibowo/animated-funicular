<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="/res/favicon.png">
    <title>Multi Timer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%270%200%2032%2032%27%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%3E%3Cpath%20d%3D%27M16%204a1%201%200%2000-1%201v1H11a1%201%200%2000-1%201v2H9a1%201%200%2000-1%201v14a2%202%200%20002%202h14a2%202%200%20002-2V10a1%201%200%2000-1-1h-1V6a1%201%200%2000-1-1h-4V5a1%201%200%2000-1-1zm0%202h2v1h-2zm-5%206v3h2v-3zm4%200v3h2v-3zm4%200v3h2v-3z%27%20fill%3D%27%23555%27/%3E%3C/svg%3E" />
    <style>
        html {
            overflow-x: hidden;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            left: -50%; 
            top: -50%;
            width: 200%; 
            height: 200%;
            z-index: -1;
            
            background-image: url('/res/logo-transkomunika1662368610.png');
            background-size: 200px;
            background-repeat: repeat; 
            transform: rotate(45deg);
            opacity: 0.15;
            pointer-events: none;
        }
		
        .floating-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #007bff;
            color: white;
            padding: 12px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1em;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .floating-button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .floating-button:active {
            transform: translateY(0px);
        }

        .container {
            max-width: 850px;
            margin: auto;
            background-color: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 1;
        }

        .app-version {
            text-align: center;
            margin-top: 15px;
            color: #6c757d;
            font-size: 0.85em;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 35px;
        }

        .timer-row {
            display: flex;
            align-items: center;
            padding: 18px 10px;
            border-bottom: 1px solid #e9ecef;
            border-left: 4px solid transparent;
            gap: 15px;
            position: relative;
            background-color: #fff;
            transition: opacity 0.2s ease, background-color 0.2s ease, border-left-color 0.2s ease;
        }

        .timer-row.active {
            background-color: #f0f7ff;
            border-left-color: #007bff;
        }

        .timer-row:last-child {
            border-bottom: none;
        }

        .drag-handle {
            cursor: grab;
            padding: 5px 8px 5px 0;
            font-size: 1.6em;
            line-height: 1;
            color: #ababab;
            user-select: none;
            align-self: center;
        }
        .timer-row.dragging .drag-handle {
            cursor: grabbing;
        }

        .timer-title {
            flex-grow: 2;
            min-width: 150px;
        }

        .timer-title input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .timer-start-time,
        .timer-elapsed-time {
            min-width: 130px;
            font-size: 0.95em;
            color: #495057;
            white-space: nowrap;
            text-align: left;
        }
        .timer-elapsed-time {
            min-width: 120px;
        }

        .timer-elapsed-time span {
            font-weight: bold;
            font-size: 1.25em;
            color: #12876f;
        }

        .timer-controls {
            display: flex;
			padding-left: 10px;
            align-items: center;
            gap: 10px;
        }

        .timer-controls button {
            padding: 9px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.2s ease, transform 0.1s ease;
            position: relative;
        }
        .timer-controls button:active {
            transform: translateY(1px);
        }

        .timer-controls button .keybind {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 0.65em;
            opacity: 0.7;
            font-weight: normal;
        }

        .start-btn { background-color: #2ecc71; color: white; }
        .start-btn:hover { background-color: #27ae60; }
        .stop-btn { background-color: #e74c3c; color: white; }
        .stop-btn:hover { background-color: #c0392b; }
        .reset-btn { background-color: #3498db; color: white; }
        .reset-btn:hover { background-color: #2980b9; }
        .remove-btn { background-color: #95a5a6; color: white; }
        .remove-btn:hover { background-color: #7f8c8d; }

        .actions-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e9ecef;
            gap: 10px;
            flex-wrap: wrap;
        }

        .actions-left, .actions-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .actions-container button {
            padding: 12px 22px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .actions-container button:active {
            transform: translateY(1px);
        }

        #add-timer-btn { background-color: #007bff; color: white; }
        #add-timer-btn:hover { background-color: #0056b3; }
        #export-csv-btn { background-color: #17a2b8; color: white; }
        #export-csv-btn:hover { background-color: #117a8b; }
        #import-csv-btn { background-color: #6c757d; color: white; }
        #import-csv-btn:hover { background-color: #5a6268; }

        .timer-row.dragging {
            opacity: 0.4;
            background: #eef6ff;
        }

        .timer-row.drag-over-placeholder {
            border-top: 3px dashed #007bff;
        }

        @media (max-width: 768px) {
            body::before {
                 background-size: 150px;
            }
            body { padding: 15px; }
            .container { padding: 20px; }
            .timer-row {
                flex-direction: column;
                align-items: stretch;
                padding: 15px 5px;
                gap: 10px;
            }
            .drag-handle {
                align-self: flex-start;
                padding: 5px 0 10px 0;
                font-size: 1.5em;
            }
            .timer-title { flex-grow: unset; }
            .timer-start-time,
            .timer-elapsed-time {
                min-width: unset;
                padding: 6px 0;
                text-align: left;
                border-top: 1px dashed #e0e0e0;
                padding-top: 10px;
                margin-top: 5px;
            }
             .timer-row > .drag-handle + .timer-title + .timer-start-time,
             .timer-row > .drag-handle + .timer-title + div + .timer-elapsed-time {
                 border-top: none;
                 padding-top: 6px;
                 margin-top: 0;
             }
            .timer-controls {
                justify-content: flex-start;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 10px;
            }
            .actions-container {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
            .actions-left, .actions-right {
                flex-direction: column;
                width: 100%;
            }
            .actions-container button { width: 100%; }
        }
        @media (max-width: 480px) {
             body::before {
                 background-size: 100px;
            }
            .timer-controls button {
                flex-basis: calc(50% - 4px);
                text-align: center;
            }
            .timer-start-time,
            .timer-elapsed-time { font-size: 0.9em; }
            .timer-elapsed-time span { font-size: 1.15em; }
            .container { padding: 15px; }
            h1 { font-size: 1.8em; margin-bottom: 25px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Multi Timer</h1>
        <div id="timers-container">
            </div>
        <div class="actions-container">
            <div class="actions-left">
                <button id="add-timer-btn">Tambah Timer Baru</button>
            </div>
            <div class="actions-right">
                <button id="import-csv-btn">Impor dari CSV</button>
                <input type="file" id="csv-file-input" accept=".csv" style="display: none;">
                <button id="export-csv-btn">Ekspor ke CSV</button>
            </div>
        </div>
        <div class="app-version">Multi Timer v1.2.0</div>
    </div>

    <script>
        const CURRENT_VERSION = 'v1.2.0';
        const timersContainer = document.getElementById('timers-container');
        const addTimerBtn = document.getElementById('add-timer-btn');
        const exportCsvBtn = document.getElementById('export-csv-btn');
        const importCsvBtn = document.getElementById('import-csv-btn');
        const csvFileInput = document.getElementById('csv-file-input');

        let timerIdCounter = 0;
        let timers = {};
        let focusedTimerId = null;

        const originalPageTitle = document.title;
        let tabUpdateInterval = null;
        let draggedItem = null;

        function formatTime(milliseconds) {
            const totalSeconds = Math.floor(milliseconds / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const ms = String(milliseconds % 1000).padStart(3, '0').substring(0,2);
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${ms}`;
        }

        function formatTimeForTab(milliseconds) {
            const totalSeconds = Math.floor(milliseconds / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function getCurrentTimestamp() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${day}/${month} ${hours}:${minutes}`;
        }

        function manageTabTitleUpdate() {
            let activeTimerData = null;
            let activeTimerTitle = '';
            const timerRows = timersContainer.querySelectorAll('.timer-row');
            for (const rowElement of timerRows) {
                const timerId = parseInt(rowElement.dataset.timerId);
                if (timers[timerId] && timers[timerId].isRunning) {
                    activeTimerData = timers[timerId];
                    const titleInput = rowElement.querySelector('.timer-title input');
                    activeTimerTitle = titleInput ? titleInput.value : `Timer ${timerId + 1}`;
                    break;
                }
            }
            if (activeTimerData) {
                const formattedTimeForTab = formatTimeForTab(activeTimerData.elapsedTime);
                document.title = `${formattedTimeForTab} [${activeTimerTitle}] - ${originalPageTitle}`;
                if (!tabUpdateInterval) {
                    tabUpdateInterval = setInterval(manageTabTitleUpdate, 500);
                }
            } else {
                document.title = originalPageTitle;
                if (tabUpdateInterval) {
                    clearInterval(tabUpdateInterval);
                    tabUpdateInterval = null;
                }
            }
        }

        function updateActiveTimerHighlight() {
            document.querySelectorAll('.timer-row').forEach(row => {
                const timerId = parseInt(row.dataset.timerId);
                if (timerId === focusedTimerId) {
                    row.classList.add('active');
                } else {
                    row.classList.remove('active');
                }
            });
        }

        function saveStateToLocalStorage() {
            const timerRows = timersContainer.querySelectorAll('.timer-row');
            const stateToSave = [];
            timerRows.forEach(rowElement => {
                const id = parseInt(rowElement.dataset.timerId);
                const timerData = timers[id];
                if (timerData) {
                    const titleInput = rowElement.querySelector('.timer-title input');
                    stateToSave.push({
                        id: id,
                        title: titleInput ? titleInput.value : `Timer ${id + 1}`,
                        elapsedTime: timerData.elapsedTime,
                        initialStartTimeDisplay: timerData.initialStartTimeDisplay
                    });
                }
            });
            localStorage.setItem('multi_timers_state', JSON.stringify(stateToSave));
            localStorage.setItem('multi_timers_counter', timerIdCounter);
        }

        function handleDragStart(e) {
            draggedItem = this;
            e.dataTransfer.setData('text/plain', this.dataset.timerId);
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => {
                this.classList.add('dragging');
            }, 0);
        }

        function handleDragEnd() {
            if (draggedItem && this === draggedItem) {
                 this.classList.remove('dragging');
            } else if (draggedItem) {
                draggedItem.classList.remove('dragging');
            }
            document.querySelectorAll('.timer-row.drag-over-placeholder').forEach(row => {
                row.classList.remove('drag-over-placeholder');
            });
            draggedItem = null;
            saveStateToLocalStorage();
        }
        
        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.timer-row:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        timersContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!draggedItem) return;
            const afterElement = getDragAfterElement(timersContainer, e.clientY);
            document.querySelectorAll('.timer-row.drag-over-placeholder').forEach(el => el.classList.remove('drag-over-placeholder'));
            if (afterElement && afterElement !== draggedItem) {
                afterElement.classList.add('drag-over-placeholder');
            }
        });

        timersContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            if (!draggedItem) return;
            const afterElement = getDragAfterElement(timersContainer, e.clientY);
            if (draggedItem !== afterElement) { 
                if (afterElement == null) {
                    timersContainer.appendChild(draggedItem);
                } else {
                    timersContainer.insertBefore(draggedItem, afterElement);
                }
            }
            saveStateToLocalStorage();
            
            let shouldUpdateTitle = false;
            const currentRunningTimersOrder = Array.from(timersContainer.querySelectorAll('.timer-row'))
                                                .filter(row => timers[row.dataset.timerId] && timers[row.dataset.timerId].isRunning)
                                                .map(row => row.dataset.timerId);
            if (currentRunningTimersOrder.length > 0) {
                shouldUpdateTitle = true;
            }

            if(shouldUpdateTitle){
                 manageTabTitleUpdate();
            }
        });

        function createTimerRow(id, initialData = {}) {
            const timerRow = document.createElement('div');
            timerRow.classList.add('timer-row');
            timerRow.dataset.timerId = id;
            timerRow.setAttribute('draggable', 'true');

            const defaultTitle = initialData.title || `Timer ${id + 1}`;
            const initialElapsedTime = initialData.elapsedTime || 0;
            const initialStartDisplay = initialData.initialStartTimeDisplay || 'Belum dimulai';

            timerRow.innerHTML = `
                <div class="drag-handle" title="Geser untuk urutkan">&#x283F;</div>
                <div class="timer-title">
                    <input type="text" placeholder="Judul Timer ${id + 1}" value="${defaultTitle}">
                </div>
                <div class="timer-start-time">Mulai: <span class="start-time-display">${initialStartDisplay}</span></div>
                <div class="timer-elapsed-time">Durasi: <span class="elapsed-time-display">${formatTime(initialElapsedTime)}</span></div>
                <div class="timer-controls">
                    <button class="start-btn" title="Keyboard: S">Mulai<span class="keybind">S</span></button>
                    <button class="stop-btn" disabled title="Keyboard: Space">Berhenti<span class="keybind">Space</span></button>
                    <button class="reset-btn" title="Keyboard: R">Reset<span class="keybind">R</span></button>
                    <button class="remove-btn">Hapus</button>
                </div>
            `;

            timerRow.addEventListener('dragstart', handleDragStart);
            timerRow.addEventListener('dragend', handleDragEnd);

            timerRow.addEventListener('mouseenter', () => {
                focusedTimerId = id;
                updateActiveTimerHighlight();
            });

            timerRow.addEventListener('click', () => {
                focusedTimerId = id;
                updateActiveTimerHighlight();
            });

            const startBtn = timerRow.querySelector('.start-btn');
            const stopBtn = timerRow.querySelector('.stop-btn');
            const resetBtn = timerRow.querySelector('.reset-btn');
            const removeBtn = timerRow.querySelector('.remove-btn');
            const elapsedTimeDisplay = timerRow.querySelector('.elapsed-time-display');
            const startTimeDisplay = timerRow.querySelector('.start-time-display');
            const titleInput = timerRow.querySelector('.timer-title input');

            timers[id] = {
                startTime: 0, elapsedTime: initialElapsedTime, intervalId: null, isRunning: false,
                initialStartTimeDisplay: initialStartDisplay,
                buttons: { startBtn, stopBtn, resetBtn }
            };
            
            if (initialElapsedTime > 0 && initialStartDisplay !== 'Belum dimulai') {
                resetBtn.disabled = false;
            }

            titleInput.addEventListener('input', () => {
                if (timers[id] && timers[id].isRunning) {
                    manageTabTitleUpdate();
                }
                saveStateToLocalStorage();
            });

            startBtn.addEventListener('click', () => {
                if (!timers[id].isRunning) {
                    if (timers[id].elapsedTime === 0 || timers[id].initialStartTimeDisplay === 'Belum dimulai') {
                        timers[id].initialStartTimeDisplay = getCurrentTimestamp();
                        startTimeDisplay.textContent = timers[id].initialStartTimeDisplay;
                    }
                    timers[id].startTime = Date.now() - timers[id].elapsedTime;
                    timers[id].intervalId = setInterval(() => {
                        timers[id].elapsedTime = Date.now() - timers[id].startTime;
                        elapsedTimeDisplay.textContent = formatTime(timers[id].elapsedTime);
                        saveStateToLocalStorage();
                    }, 10);
                    timers[id].isRunning = true;
                    startBtn.disabled = true;
                    startBtn.innerHTML = 'Jalan<span class="keybind">S</span>';
                    stopBtn.disabled = false;
                    resetBtn.disabled = true;
                    manageTabTitleUpdate();
                    saveStateToLocalStorage();
                }
            });

            stopBtn.addEventListener('click', () => {
                if (timers[id].isRunning) {
                    clearInterval(timers[id].intervalId);
                    timers[id].isRunning = false;
                    startBtn.disabled = false;
                    startBtn.innerHTML = 'Mulai<span class="keybind">S</span>';
                    stopBtn.disabled = true;
                    resetBtn.disabled = false;
                    manageTabTitleUpdate();
                    saveStateToLocalStorage();
                }
            });

            resetBtn.addEventListener('click', () => {
                clearInterval(timers[id].intervalId);
                timers[id].elapsedTime = 0;
                timers[id].isRunning = false;
                timers[id].initialStartTimeDisplay = 'Belum dimulai';
                elapsedTimeDisplay.textContent = formatTime(0);
                startTimeDisplay.textContent = timers[id].initialStartTimeDisplay;
                startBtn.disabled = false;
                startBtn.innerHTML = 'Mulai<span class="keybind">S</span>';
                stopBtn.disabled = true;
                resetBtn.disabled = true;
                manageTabTitleUpdate();
                saveStateToLocalStorage();
            });

            removeBtn.addEventListener('click', () => {
                clearInterval(timers[id].intervalId);
                delete timers[id];
                timerRow.remove();
                manageTabTitleUpdate();
                saveStateToLocalStorage();
                if (focusedTimerId === id) {
                    focusedTimerId = null;
                    updateActiveTimerHighlight();
                }
            });

            return timerRow;
        }

        function addTimer(initialData = {}) {
            const newTimerId = timerIdCounter++;
            const timerElement = createTimerRow(newTimerId, initialData);
            timersContainer.appendChild(timerElement);
            saveStateToLocalStorage();
            if (focusedTimerId === null) {
                focusedTimerId = newTimerId;
                updateActiveTimerHighlight();
            }
        }

        function loadStateFromLocalStorage() {
            const savedState = localStorage.getItem('multi_timers_state');
            const savedCounter = localStorage.getItem('multi_timers_counter');

            if (savedCounter) {
                timerIdCounter = parseInt(savedCounter, 10) || 0;
            }

            if (savedState) {
                try {
                    const parsedState = JSON.parse(savedState);
                    if (Array.isArray(parsedState) && parsedState.length > 0) {
                        parsedState.forEach(item => {
                            const timerElement = createTimerRow(item.id, item);
                            timersContainer.appendChild(timerElement);
                            if (item.id >= timerIdCounter) {
                                timerIdCounter = item.id + 1;
                            }
                        });
                        const firstRow = timersContainer.querySelector('.timer-row');
                        if (firstRow) {
                            focusedTimerId = parseInt(firstRow.dataset.timerId, 10);
                            updateActiveTimerHighlight();
                        }
                        return;
                    }
                } catch (e) {
                    console.error('Gagal memuat state dari localStorage:', e);
                }
            }
            addTimer();
        }

        document.addEventListener('keydown', (e) => {
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable)) {
                return;
            }

            if (focusedTimerId === null || !timers[focusedTimerId]) return;

            const timer = timers[focusedTimerId];
            const { startBtn, stopBtn, resetBtn } = timer.buttons;

            if (e.key.toLowerCase() === 's' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                if (!startBtn.disabled) {
                    startBtn.click();
                    e.preventDefault();
                }
            }
            else if (e.code === 'Space' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                if (!stopBtn.disabled) {
                    stopBtn.click();
                    e.preventDefault();
                }
            }
            else if (e.key.toLowerCase() === 'r' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                if (!resetBtn.disabled) {
                    resetBtn.click();
                    e.preventDefault();
                }
            }
        });

        function formatCsvField(field) {
            const fieldStr = String(field);
            if (fieldStr.includes('"') || fieldStr.includes(',') || fieldStr.includes('\n') || fieldStr.includes('\r')) {
                return `"${fieldStr.replace(/"/g, '""')}"`;
            }
            return fieldStr;
        }

        function exportToCsv() {
            const rows = [
                ['#version', CURRENT_VERSION],
                ['Judul Timer', 'Waktu Mulai', 'Durasi (MM:SS.ms)']
            ];
            timersContainer.querySelectorAll('.timer-row').forEach(rowElement => {
                const timerId = parseInt(rowElement.dataset.timerId);
                const timerData = timers[timerId];
                if (timerData) {
                    const title = rowElement.querySelector('.timer-title input').value || `Timer ${timerId + 1}`;
                    const startTime = timerData.initialStartTimeDisplay;
                    const duration = formatTime(timerData.elapsedTime);
                    rows.push([title, startTime, duration]);
                }
            });

            let csvContent = "";
            rows.forEach(rowArray => {
                let row = rowArray.map(field => formatCsvField(field)).join(",");
                csvContent += row + "\r\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            
            const now = new Date();
            const timestamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}${String(now.getSeconds()).padStart(2, '0')}`;
            // Diubah dari timers_export_timestamp menjadi multitimer_dataset_timestamp
            link.setAttribute("download", `multitimer_dataset_${timestamp}.csv`);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function parseCsvLine(text) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    if (inQuotes && text[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }

        function parseDurationToMs(durationStr) {
            const parts = durationStr.split(':');
            if (parts.length !== 2) return 0;
            const minutes = parseInt(parts[0], 10) || 0;
            const secParts = parts[1].split('.');
            const seconds = parseInt(secParts[0], 10) || 0;
            const ms = secParts[1] ? parseInt(secParts[1].padEnd(3, '0'), 10) : 0;
            return (minutes * 60 * 1000) + (seconds * 1000) + ms;
        }

        function importFromCsv(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r\n|\n/);
                
                if (lines.length <= 1) {
                    alert('File CSV kosong atau tidak valid.');
                    return;
                }

                let startIndex = 0;
                let fileVersion = 'v1.0.0 (legacy)';

                const firstLineFields = parseCsvLine(lines[0].trim());
                if (firstLineFields[0] === '#version' || firstLineFields[0] === 'Version') {
                    fileVersion = firstLineFields[1] || 'v1.0.0';
                    startIndex = 1;
                }

                if (startIndex < lines.length) {
                    const headerFields = parseCsvLine(lines[startIndex].trim());
                    if (headerFields[0] === 'Judul Timer') {
                        startIndex++;
                    }
                }

                if (fileVersion !== CURRENT_VERSION) {
                    alert(`Perhatian: File CSV yang Anda impor menggunakan versi (${fileVersion}), sedangkan versi saat ini adalah ${CURRENT_VERSION}.\nTerdeteksi potensi perubahan format atau struktur pengurutan data. Data akan diperbarui dan disesuaikan ke versi ${CURRENT_VERSION}.`);
                }

                Object.keys(timers).forEach(id => {
                    clearInterval(timers[id].intervalId);
                });
                timers = {};
                timersContainer.innerHTML = '';
                focusedTimerId = null;

                for (let i = startIndex; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const fields = parseCsvLine(line);
                    if (fields.length >= 3) {
                        const title = fields[0];
                        const startTimeDisplay = fields[1];
                        const durationStr = fields[2];
                        const elapsedTime = parseDurationToMs(durationStr);

                        addTimer({
                            title: title,
                            elapsedTime: elapsedTime,
                            initialStartTimeDisplay: startTimeDisplay
                        });
                    }
                }

                csvFileInput.value = '';
                alert(`Data timer berhasil diimpor dan diselaraskan ke versi ${CURRENT_VERSION}!`);
            };
            reader.readAsText(file);
        }

        addTimerBtn.addEventListener('click', () => addTimer());
        exportCsvBtn.addEventListener('click', exportToCsv);
        importCsvBtn.addEventListener('click', () => csvFileInput.click());
        csvFileInput.addEventListener('change', importFromCsv);

        loadStateFromLocalStorage();
        manageTabTitleUpdate();
    </script>
